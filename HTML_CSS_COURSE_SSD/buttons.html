<!DOCTYPE html>
<html>

<head>
    <title>Buttons Practice</title>
    <!--CSS
    - CSS selector
        - in this case we can change the color of all buttons red
        - CSS property : value
    - void elements (self closing tags)
-->
<link rel="stylesheet" href="buttons.css">


</head>

<body>
    <button class="subscribe-button">
        SUBSCRIBE
    </button>

    <button class="join-button">
        JOIN
    </button>

    <button class="tweet-button">
        Tweet
    </button>

    <button class="request-now-button">
        Request Now
    </button>

    <button class="add-to-cart-button">

    </button>

    <button class="sign-up-button">
        Sign Up
    </button>

    <button class="bootstrap-get-started-button">
        Get started
    </button>

    <button class="bootstrap-download-button">
        Download
    </button>

    <button class="linkedin-apply-on-company-website-button">
        Apply on company website
    </button>

    <button class="linkedin-save-button">
        Save
    </button>

    <button>
        Back
    </button>

    <a href="https://music.apple.com/">1</a>
    <a href="https://music.apple.com/">2</a>
    <a href="https://music.apple.com/">3</a>
    <a href="https://music.apple.com/">4</a>
    <a href="https://music.apple.com/">5</a>

    <button>
        Next
    </button>

    <button class="stretched-button">
        Stretch
    </button>

    <button class="shadow-button">
        Shadow
    </button>

    <button class="margin-padding-put-together-button">
        One
    </button>

    <button class="margin-padding-put-together-button">
        Two
    </button>

    <button class="margin-padding-put-together-button">
        Three
    </button>

</html>
