<!DOCTYPE html>
<html>
  <head>
    <title>Functions</title>
  </head>
  <body>
    <script>
      function function1() {
        console.log("hello there");
        console.log(2 + 2);
      }
      function1();
      function1();
         function calculateTax(cost, taxPercent = 0.1){
      console.log(cost * taxPercent);
    }

    calculateTax(2000, 0.13);
    calculateTax(5000);

    function convertToFaherenheit(celsius){
      return (celsius * 9 / 5) + 32;
    }
    console.log(convertToFaherenheit(25))

    function convertToCelsius(fahrenheit){
      return (fahrenheit - 32) * 5 / 9;
    }
    console.log(convertToCelsius(86));

    function convertTemperature(degrees, unit){
      if (unit === 'C'){
        return (degrees * 9 / 5) + 32 + "F";
      }
      
      else if (unit === 'F') {
         return (degrees - 32) * 5 / 9 + "C"
      }
       
      else {
        throw "Unit not valid";
      }
    }
    console.log(convertTemperature(25,'C'));
    console.log(convertTemperature(86,'F'));

    function convertLength(length, from, to){
      if (from === 'km' && to === 'miles'){
        return length / 1.6 + 'miles';
      }

      else if (from === 'miles' && to === 'km'){
        return length * 1.6 + 'km';
      }

      else if (from === 'ft' && to === 'km'){
        return length / 3281 + 'km';
      }

      else if (from === 'km' && to === 'ft'){
        return length * 3281 + 'ft';
      }

      else if (from === 'ft' && to === 'miles'){
        return length / 5280 + 'miles';
      }

      else if (from === 'miles' && to === 'ft'){
        return length * 5280 + 'ft';
      }

      else if (from === to){
        return length + from;
      }

      else {
        throw `Invalid unit: ${from}`
      }
    }

    console.log(convertLength(50,'miles','km'));
    console.log(convertLength(32,'km','miles'));
    console.log(convertLength(50,'km','km'));
    
    console.log(convertLength(5,'miles','km'));
    console.log(convertLength(5,'miles','ft'));
    console.log(convertLength(50,'km','ft'));
    </script>
  </body>
</html>
