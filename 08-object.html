        // Auto-boxing wrap the stirng in a special object
        console.log('hello'.length);
        console.log('hello'.toUpperCase());

        const object1 = {
            message: 'hello'
        };

        // reference in memory, like string in java

        const object2 = object1;

        object1.message = 'good job';
        console.log(object2);
        console.log(object1);

        const object3 = {
            message: 'good job'
        };

        console.log(object1 === object3);
        // compares reference, not the values
        console.log(object1 === object2);


        const object4 = {
